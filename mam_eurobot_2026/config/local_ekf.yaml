ekf_local_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    
    map_frame: map
    world_frame: odom
    odom_frame: odom
    base_link_frame: base_link

    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, true, 
                  false, false, false,
                  false, false, true]
    imu0_relative: true  # if this FALSE that means : Trust the initial_state Yaw"

    odom0: /mecanum_drive_controller/odometry
    odom0_config: [true, true, false, 
                   false, false, false, 
                   true,  true,  false, 
                   false, false, true]
    odom0_relative: false
    odom0_differential: false

    pose0: /amcl_pose
    pose0_config: [true, true, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    pose0_differential: false
    pose0_relative: false