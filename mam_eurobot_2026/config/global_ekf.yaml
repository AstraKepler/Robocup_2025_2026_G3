ekf_global_node:
  ros__parameters:
    frequency: 10.0
    two_d_mode: true
    publish_tf: true 

    map_frame: map
    world_frame: map 
    odom_frame: odom
    base_link_frame: base_link
    
    odom0: /mecanum_drive_controller/odometry
    odom0_config: [false, false, false, false, false, false, 
                   true,  true,  false, false, false, true]
    odom0_relative: true


    imu0: /imu
    imu0_config: [false, false, false, false, false, false, 
                  false, false, false, false, false, true]
    imu0_relative: true


    pose0: /camera/pose
    pose0_config: [true,  true,  false, 
                   false, false, true, 
                   false, false, false, 
                   false, false, false]
    pose0_differential: false 
    pose0_relative: false

